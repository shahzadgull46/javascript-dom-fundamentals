<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GitHub Profile Card</title>
  </head>
  <body
    style="background-color: #212121; color: white; font-family: sans-serif"
  >
    <input type="text" id="username" placeholder="Enter GitHub username" />
    <button id="fetchBtn">Get Profile</button>

    <div id="card" style="margin-top: 20px"></div>

    <script>
  const button = document.querySelector("#fetchBtn");
  const card = document.querySelector("#card");

  button.addEventListener("click", function () {
    const username = document.querySelector("#username").value;
    const requestUrl = `https://api.github.com/users/${username}`;

    const xhr = new XMLHttpRequest();
    xhr.open("GET", requestUrl);

    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) {
        const data = JSON.parse(this.responseText);
        card.innerHTML = `
          <img src="${data.avatar_url}" width="100" />
          <p>Followers: ${data.followers}</p>
          <p>Name: ${data.name}</p>
        `;
      }
    };

    xhr.send();
  });
</script>
  </body>
</html>
