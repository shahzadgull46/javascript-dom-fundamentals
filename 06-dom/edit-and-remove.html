<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Pratice</title>
  </head>

  <body style="background-color: #212121; color: #fff">
    <h1>DOM Pratice</h1>
    <ul class="language">
      <li>JavaScript</li>
    </ul>
  </body>
  <script>
    function addLang(langName) {
      const li = document.createElement("li");
      li.innerHTML = `${langName}`;
      const newLang = document.querySelector(".language");
      newLang.appendChild(li);
    }
    addLang("Python");
    addLang("React");


    // Optimised way or better approach 
    function addOptiLang(langName) {
      const li = document.createElement("li");
      li.appendChild(document.createTextNode(langName));
      const newLang = document.querySelector(".language");
      newLang.appendChild(li);
    }
    addOptiLang("NodeJs");

   // Edit:

const secondLang = document.querySelector("li:nth-child(2)")
console.log(secondLang)
// again using innerHTML is not better approach
// secondLang.innerHTML = "Java"

const newLi = document.createElement('li')
newLi.textContent = "TypeScript"
secondLang.replaceWith(newLi)


// Remove:
const lastLang = document.querySelector("li:last-child")
// console.log(lastLang)
lastLang.remove()


  </script>
</html>
